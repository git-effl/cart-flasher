name: Build Cart-Flasher release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-latest
    env:
      BLOCKSDS: /opt/wonderful/thirdparty/blocksds/core
    name: Build with BlocksDS toolchain using official Docker image
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
      - name: Build app
        id: build
        # NDS_OUT is fixed so every release carries an identically-named asset,
        # keeping the /releases/latest/download/cart_flasher.nds URL permanent.
        # The version and commit shown on the boot screen are unaffected.
        run: |
          make NDS_OUT=cart_flasher.nds BANNER_VERSION="Release: ${{ github.ref_name }}" CART_FLASHER_COMMIT=$(echo "${{ github.sha }}" | cut -c1-7) CART_FLASHER_VERSION=${{ github.ref_name }} CART_FLASHER_BUILD_KIND=Release
      - name: Install GitHub CLI
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends gh
          rm -rf /var/lib/apt/lists/*
      - name: Verify GitHub CLI authentication
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}" --jq .full_name
      - name: Preserve release test ROM
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cart_flasher-release-test-${{ github.sha }}
          path: cart_flasher.nds
          if-no-files-found: error
          retention-days: 14
      - name: Upload cart_flasher.nds
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" cart_flasher.nds --clobber
