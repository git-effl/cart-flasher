name: Build Cart-Flasher

on:
  push:
    branches: ["*"]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: ["*"]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-latest
    env:
      BLOCKSDS: /opt/wonderful/thirdparty/blocksds/core
    name: Build with BlocksDS toolchain using official Docker image
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
      - name: Build app
        id: build
        run: |
          SHORT_SHA=$(printf '%.7s' "$GITHUB_SHA")
          NDS_NAME="cart_flasher-nightly-$SHORT_SHA.nds"
          make NDS_OUT="$NDS_NAME" CART_FLASHER_COMMIT="$SHORT_SHA" CART_FLASHER_VERSION=nightly CART_FLASHER_BUILD_KIND=Nightly
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v7.0.1
        with:
          # Keep the hash in the filename so downloaded nightlies identify
          # their commit.
          path: cart_flasher-*.nds
          name: cart_flasher-nightly-${{ steps.build.outputs.short_sha }}
          if-no-files-found: error
          retention-days: 14
